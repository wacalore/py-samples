[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "options-chain-analyzer"
version = "0.1.0"
description = "EOD futures options chain analytics: implied vol, greeks, surface fit, and strategy book."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Proprietary"}
authors = [
  {name = "Options Backtester"},
]
dependencies = [
  "numpy>=1.21",
  "scipy>=1.8",
  "pandas>=1.5",
]

[project.optional-dependencies]
speed = ["numba>=0.56"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["options_chain_analyzer"]
